<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Vizyon kurulum kodu</title>
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { padding: 24px 16px 48px; }
    .setup { max-width: 560px; margin: 0 auto; }
    .setup header { display: grid; justify-items: start; gap: 12px; margin-bottom: 18px; }
    .setup header img { width: 220px; background: #000; padding: 14px 18px; border-radius: 18px; }
    .setup select { width: 100%; min-height: var(--tap); padding: 0 12px; border-radius: var(--radius); border: 1.5px solid transparent; background: var(--fill); font-size: 17px; }
    #out { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>
  <main class="setup stack">
    <header>
      <img src="img/lockup-dark.png" alt="Auto Vizyon">
      <h1>Kurulum kodu</h1>
      <p class="muted">Bilgileri yaz, "Kodu üret"e bas, çıkan kodu babana WhatsApp'tan gönder. O da uygulamada Ayarlar → Yapıştır yapar. Bu sayfa hiçbir şeyi internete göndermez, kodu bu cihazda üretir.</p>
    </header>
    <section class="card section stack">
      <label class="field"><span>Anthropic API anahtarı</span><input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off"></label>
      <label class="field"><span>Model</span>
        <select id="model">
          <option value="claude-opus-5-5">Claude Opus 5.5 (en doğru)</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5 (en ucuz)</option>
        </select>
      </label>
      <label class="field"><span>Google Apps Script adresi (isteğe bağlı)</span><input id="scriptUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="field"><span>Google anahtarı (isteğe bağlı)</span><input id="token" type="password" autocomplete="off"></label>
      <button id="make" class="btn primary block" type="button">Kodu üret</button>
    </section>
    <section id="result" class="card section stack" hidden>
      <h3>Kurulum kodu</h3>
      <textarea id="out" rows="5" readonly></textarea>
      <button id="copy" class="btn block" type="button">Kodu kopyala</button>
      <p class="muted small">Kod anahtarı içerir; sadece babana gönder.</p>
    </section>
  </main>
  <script type="module">
    import { encodeSetup } from './js/lib/setupcode.js';
    const $ = (id) => document.getElementById(id);
    $('make').addEventListener('click', () => {
      const code = encodeSetup({ apiKey: $('apiKey').value.trim(), model: $('model').value, scriptUrl: $('scriptUrl').value.trim(), token: $('token').value.trim() });
      $('out').value = code;
      $('result').hidden = false;
    });
    $('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText($('out').value); } catch { $('out').select(); document.execCommand('copy'); }
      $('copy').textContent = 'Kopyalandı';
    });
  </script>
</body>
</html>
